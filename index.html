
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB Tournament</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

<header>
  <div class="logo">MLBB TOURNAMENT</div>
  <div>ESPORTS</div>
</header>

<section class="hero">
  <h1>MLBB <span>TOURNAMENT</span></h1>
  <p>Buktikan kemampuan tim kamu!<br>Daftarkan tim dan jadilah juara.</p>
</section>

<div class="container">
  <h2>FORM PENDAFTARAN TIM</h2>

  <form id="registrationForm">
    <label>Nama Tim</label>
    <input type="text" placeholder="Nama tim" required>

    <label>Nama Kapten</label>
    <input type="text" placeholder="Nama kapten" required>

    <label>ID MLBB Kapten</label>
    <input type="text" placeholder="ID MLBB" required>

    <label>Server Kapten</label>
    <input type="text" placeholder="Server" required>

    <h3>DATA PEMAIN</h3>
    <div id="players"></div>

    <button type="submit">DAFTAR TURNAMEN</button>
  </form>
</div>

<footer>MLBB TOURNAMENT © 2026</footer>

</body>
</html>
